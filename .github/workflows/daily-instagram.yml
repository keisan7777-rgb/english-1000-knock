name: Daily Instagram post

on:
  schedule:
    # 22:00 UTC = 翌日の日本時間 07:00
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      post_id:
        description: "テストする投稿ID（空欄なら日本時間の当日分）"
        required: false
        type: string
      publish:
        description: "実際にInstagramへ投稿する"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      MANUAL_POST_ID: ${{ inputs.post_id }}
      PUBLIC_MEDIA_BASE_URL: https://keisan7777-rgb.github.io/english-1000-knock
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_API_VERSION: v23.0
      INSTAGRAM_GRAPH_BASE_URL: https://graph.instagram.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select post and publish
        shell: bash
        run: |
          post_date="$(TZ=Asia/Tokyo date +%F)"
          args=(--date "$post_date" --skip-if-missing)

          if [[ -n "$MANUAL_POST_ID" ]]; then
            args=(--post-id "$MANUAL_POST_ID")
          fi

          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.publish }}" == "true" ]]; then
            args+=(--publish)
          fi

          python3 src/post_instagram.py "${args[@]}"

      - name: Record successful publication
        if: ${{ github.event_name == 'schedule' || inputs.publish == true }}
        run: |
          if git diff --quiet -- data/published.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published.json
          git commit -m "Record published Instagram post"
          git push
